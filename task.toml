schema_version = "1.3"

[task]
name = "local/license-envelope-verifier"
authors = [{ name = "fengyin" }]
description = "Repair a release gate that validates vendor license envelopes and RSA signatures."
keywords = ["der-parsing", "pkcs1-v1.5", "rsa-verification", "license-gate", "pytest"]

[agent]
timeout_sec = 1800

[environment]
build_timeout_sec = 900
cpus = 2
memory_mb = 2048
storage_mb = 4096
gpus = 0
allow_internet = false

[verifier]
timeout_sec = 600

[metadata]
difficulty = "hard"
category = "security"
tags = ["der-strictness", "signature-verification", "release-gating", "binary-encoding"]
expert_time_estimate = "1h"
